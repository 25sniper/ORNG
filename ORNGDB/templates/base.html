<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=overlays-content">
    <title>ORNG Delivery v1.0</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body { background-color: #f8f9fa; font-family: 'Inter', sans-serif; display: flex; flex-direction: column; min-height: 100vh; }
        .content-wrapper { flex: 1 0 auto; }
        h1, h2, h3, h4, h5, h6, .navbar-brand { font-family: 'Outfit', sans-serif; }
        .navbar-brand { font-weight: bold; color: #ff6600 !important; }
    </style>
</head>
<body>
    <div class="content-wrapper">
        <nav class="navbar navbar-light bg-white shadow-sm mb-3 py-2">
            <div class="container d-flex justify-content-between align-items-center flex-nowrap">
                <a class="navbar-brand text-decoration-none fw-bold me-2 d-flex align-items-center gap-2" href="{% url 'home' %}" style="color: #ff6600 !important; font-size: 1.1rem; white-space: nowrap;">
                    ORNG Delivery
                    <span class="badge rounded-pill bg-light border text-muted fw-normal" style="font-size: 0.65rem; padding: 0.25em 0.6em;">v1.0</span>
                </a>
                {% if user.is_authenticated %}
                    <div class="d-flex align-items-center flex-nowrap">
                        <a href="{% url 'profile_view' %}" class="text-decoration-none ms-1">
                            <div class="d-flex align-items-center justify-content-center rounded-circle text-white shadow-sm" style="width: 32px; height: 32px; background: linear-gradient(135deg, #ff8a00, #e52e71); font-size: 1rem; font-weight: bold; transition: transform 0.2s;" onmouseover="this.style.transform='scale(1.1)'" onmouseout="this.style.transform='scale(1)'" title="View Profile">
                                {{ user.username.0|upper }}
                            </div>
                        </a>
                    </div>
                {% endif %}
            </div>
        </nav>

        <div class="container">
            {% block content %}{% endblock %}
        </div>
    </div>

    <footer class="footer bg-white border-top py-3 mt-auto shadow-sm">
        <div class="container text-center text-muted small">
            <span class="fw-semibold" style="color: #ff6600;">ORNG Delivery</span> <span class="text-muted opacity-75">v1.0</span> &bull; &copy; 2026
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    {% block scripts %}{% endblock %}
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(registrations) {
                for(let registration of registrations) {
                    registration.unregister().then(function(boolean) {
                        console.log('Service worker unregistered');
                    });
                }
            });
        }
    </script>
</body>
</html>
